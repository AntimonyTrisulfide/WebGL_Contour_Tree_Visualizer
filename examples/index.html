<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Parser Example - Contour Tree Visualizer</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../lib/gl-matrix-min.js"></script>
    <script>
        // Make gl-matrix components available globally
        window.mat4 = glMatrix.mat4;
        window.vec3 = glMatrix.vec3;
        window.vec4 = glMatrix.vec4;
        window.mat3 = glMatrix.mat3;
    </script>
    <!-- Core visualizer files (parser-independent) -->
    <script src="../src/globalvar.js" defer></script>
    <script src="../src/dataHandler.js"></script>
    <script src="../src/universalParser.js"></script>
    <script src="../src/primitives.js"></script>
    <script src="../src/selectionManager.js"></script>
    <script src="../src/uiManager.js"></script>
    <script src="../src/input.js" defer></script>
    <script src="../src/camera.js"></script>
    <script src="../src/initialize.js"></script>
    <script src="../src/renderer.js"></script>
    <script src="../src/mousePicking.js"></script>
    <script src="../src/edgeInfo.js"></script>
    <script src="../src/multipleEdgeInfo.js"></script>
    <script src="../src/visualizerAPI.js"></script>
    <script src="../src/debug.js"></script>
</head>
<body>
    <div class="controls">
        <div class="file-input-wrapper">
            <input type="file" id="universalInput" accept=".json,.xml,.csv,.off">
            <label for="universalInput" class="file-input-label">Load Tree Data (Any Format)</label>
        </div>
        <div class="file-input-wrapper">
            <input type="file" id="fileInput" accept=".off" style="display: none;">
            <label for="fileInput" class="file-input-label" style="display: none;">Load OFF File (Hidden)</label>
        </div>
        <button id="generateSample" class="file-input-label">Generate Sample Tree</button>
        <button id="clearSelection" class="reset-button">Clear Selection</button>
        <button id="toggleSpacing" class="reset-button">Toggle Spacing (P)</button>
        
        <div class="radius-controls">
            <div class="slider-control">
                <label for="sphereRadiusSlider">Sphere Radius: <span id="sphereRadiusValue">0.1</span></label>
                <input type="range" id="sphereRadiusSlider" min="0.01" max="0.5" step="0.01" value="0.1">
            </div>
            <div class="slider-control">
                <label for="pipeRadiusSlider">Pipe Radius: <span id="pipeRadiusValue">0.02</span></label>
                <input type="range" id="pipeRadiusSlider" min="0.001" max="0.1" step="0.001" value="0.02">
            </div>
        </div>
        
        <div class="fps-controls">
            <button id="fpsToggleButton" class="fps-button">Start FPS Counter</button>
            <div id="fpsDisplay" class="fps-display">FPS: --</div>
        </div>
    </div>

    <div class="instructions">
        <!-- <h3>Universal Parser Example</h3>
        <p>This example demonstrates the universal parser system that automatically detects file types and uses the appropriate parser.</p>
        <ul>
            <li><strong>Supported Formats:</strong> JSON, XML, CSV, OFF</li>
            <li><strong>Auto-Detection:</strong> File type detected by extension</li>
            <li><strong>Extensible:</strong> Easy to add new parsers</li>
            <li><strong>Sample Generator:</strong> Generate a sample tree programmatically</li>
        </ul>
        <p><strong>Controls:</strong> Use mouse to rotate, click to select edges, P to toggle spacing</p> -->
        <h3>Test Script</h3>
    </div>

    <div id="edgeInfoPanel" class="edge-info-panel collapsed">
        <div class="edge-info-header" id="edgeInfoHeader">
            <span class="edge-info-title">Edge Information</span>
            <button class="edge-info-toggle" id="edgeInfoToggle">▼</button>
        </div>
        <div class="edge-info-content" id="edgeInfoContent">
            <div class="edge-info-item">
                <strong>Edge Number:</strong> <span id="edgeNumber">-</span>
            </div>
            <div class="edge-info-item">
                <strong>From Vertex:</strong> <span id="fromVertex">-</span>
            </div>
            <div class="edge-info-item">
                <strong>To Vertex:</strong> <span id="toVertex">-</span>
            </div>
            <div class="edge-info-item">
                <strong>From Type:</strong> <span id="fromVertexType">-</span>
            </div>
            <div class="edge-info-item">
                <strong>To Type:</strong> <span id="toVertexType">-</span>
            </div>
            <div class="edge-info-item">
                <strong>From Value:</strong> <span id="fromVertexValue">-</span>
            </div>
            <div class="edge-info-item">
                <strong>To Value:</strong> <span id="toVertexValue">-</span>
            </div>
            <div class="edge-info-item">
                <strong>Connection Type:</strong> <span id="connectionType">L-shaped</span>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Initialize viewport after canvas is set up
        if (typeof updateViewport === 'function') {
            updateViewport();
        }

        // Sample Tree Generator
        function generateSampleTree() {
            console.log('📝 Generating sample tree data...');
            
            // Create a simple tree structure
            const vertices = [
                [0, 0, 0],     // 0 - Root (minimum)
                [-1, 1, 0],    // 1 - Left saddle
                [1, 1, 0],     // 2 - Right saddle
                [-2, 2, 0],    // 3 - Left maximum
                [0, 2, 0],     // 4 - Center maximum
                [2, 2, 0],     // 5 - Right maximum
                [0, 3, 0]      // 6 - Top maximum
            ];
            
            const edges = [
                [0, 1],  // Root to left saddle
                [0, 2],  // Root to right saddle
                [1, 3],  // Left saddle to left maximum
                [1, 4],  // Left saddle to center maximum
                [2, 4],  // Right saddle to center maximum
                [2, 5],  // Right saddle to right maximum
                [4, 6]   // Center maximum to top maximum
            ];
            
            const vertexTypes = [
                NODE_TYPES.MINIMUM,  // 0
                NODE_TYPES.SADDLE,   // 1
                NODE_TYPES.SADDLE,   // 2
                NODE_TYPES.MAXIMUM,  // 3
                NODE_TYPES.MAXIMUM,  // 4
                NODE_TYPES.MAXIMUM,  // 5
                NODE_TYPES.MAXIMUM   // 6
            ];
            
            const vertexValues = [0.0, 0.5, 0.5, 1.0, 1.0, 1.0, 1.5];
            
            console.log('✅ Sample Generator: Generated sample tree with', vertices.length, 'vertices');
            return {
                vertices,
                edges,
                vertexTypes,
                vertexValues
            };
        }



        // Visualizer configuration
        function getVisualizerConfig() {
            // Get current slider values or use defaults
            const currentSphereRadius = document.getElementById('sphereRadiusSlider') ? 
                parseFloat(document.getElementById('sphereRadiusSlider').value) : 0.1;
            const currentPipeRadius = document.getElementById('pipeRadiusSlider') ? 
                parseFloat(document.getElementById('pipeRadiusSlider').value) : 0.02;
            
            return {
                lightConfig: {
                    directions: {
                        dir: [0.0, 0.0, 0.1]
                    },
                    colors: {
                        col: [1.0, 1.0, 1.0]
                    }
                },
                colors: {
                    nodeColors: {
                        [NODE_TYPES.MINIMUM]: [0.000, 0.000, 1.000, 1.0],   // Blue
                        [NODE_TYPES.SADDLE]: [0.000, 1.000, 1.000, 1.0],    // Cyan
                        [NODE_TYPES.MAXIMUM]: [1.000, 0.000, 0.000, 1.0]    // Red
                    },
                    pipeColor: [0.9, 0.9, 0.9, 1.0],
                    backgroundColor: [0.1, 0.1, 0.1, 1.0]
                },
                globalVars: {
                    sphereRadius: currentSphereRadius,
                    pipeRadius: currentPipeRadius
                }
            };
        }

        // Function to check if tree data is different
        function isTreeDataDifferent(newData, currentData) {
            if (!currentData || !newData) return true;
            
            // Compare basic properties
            if (newData.vertices?.length !== currentData.vertices?.length ||
                newData.edges?.length !== currentData.edges?.length ||
                newData.vertexTypes?.length !== currentData.vertexTypes?.length ||
                newData.vertexValues?.length !== currentData.vertexValues?.length) {
                return true;
            }
            
            // Quick hash comparison for deeper changes
            const newHash = JSON.stringify({
                vertices: newData.vertices?.slice(0, 5), // Sample first 5 vertices
                edges: newData.edges?.slice(0, 5),
                vertexTypes: newData.vertexTypes?.slice(0, 5),
                vertexValues: newData.vertexValues?.slice(0, 5)
            });
            
            const currentHash = JSON.stringify({
                vertices: currentData.vertices?.slice(0, 5),
                edges: currentData.edges?.slice(0, 5),
                vertexTypes: currentData.vertexTypes?.slice(0, 5),
                vertexValues: currentData.vertexValues?.slice(0, 5)
            });
            
            return newHash !== currentHash;
        }

        // Visualize parsed data
        function visualizeTreeData(treeData, sourceName) {
            console.log(`🎨 Visualizing tree data from ${sourceName}...`);
            
            // Check if we have existing data and this is different
            const isDifferentData = window.currentTreeData && isTreeDataDifferent(treeData, window.currentTreeData);
            
            // Force complete reinitialization when loading different data
            if (isDifferentData) {
                console.log('🔄 Different data detected, forcing complete reinitialization...');
                if (typeof forceCompleteReinitialization === 'function') {
                    forceCompleteReinitialization();
                } else if (typeof window.forceCompleteReinitialization === 'function') {
                    window.forceCompleteReinitialization();
                }
            }
            
            // Store the current tree data globally for spacing toggle and other operations
            window.currentTreeData = treeData;
            window.treeData = treeData; // Also store in the location the visualizer expects
            
            // If this is a different file being loaded, call initializeGraph directly
            if (isDifferentData) {
                console.log('📊 Different file loaded, calling initializeGraph directly...');
                
                // Call initializeGraph directly for file changes
                if (typeof initializeGraph === 'function') {
                    console.log('🔄 Calling initializeGraph for new file data...');
                    initializeGraph();
                } else {
                    console.log('⚠️ initializeGraph not available, falling back to API');
                    // Fallback to API method
                    const config = getVisualizerConfig();
                    if (typeof invokeContourTreeVisualizer === 'function') {
                        const result = invokeContourTreeVisualizer(
                            treeData,
                            config.lightConfig,
                            config.colors,
                            config.globalVars,
                            [] // No initial edge selection
                        );
                        
                        if (result.success) {
                            console.log(`✅ Successfully visualized ${sourceName} data:`, result.message);
                        } else {
                            console.error(`❌ Failed to visualize ${sourceName} data:`, result.message);
                        }
                    }
                }
            } else {
                console.log('📊 First time loading or same data, using API method...');
                // Use API method for first load or same data
                const config = getVisualizerConfig();
                if (typeof invokeContourTreeVisualizer === 'function') {
                    const result = invokeContourTreeVisualizer(
                        treeData,
                        config.lightConfig,
                        config.colors,
                        config.globalVars,
                        [] // No initial edge selection
                    );
                    
                    if (result.success) {
                        console.log(`✅ Successfully visualized ${sourceName} data:`, result.message);
                    } else {
                        console.error(`❌ Failed to visualize ${sourceName} data:`, result.message);
                    }
                } else {
                    console.error('❌ Visualizer API not available');
                }
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize slider values and display
            const sphereSlider = document.getElementById('sphereRadiusSlider');
            const pipeSlider = document.getElementById('pipeRadiusSlider');
            const sphereValueDisplay = document.getElementById('sphereRadiusValue');
            const pipeValueDisplay = document.getElementById('pipeRadiusValue');
            
            // Set initial values from global variables or defaults
            const initialSphereRadius = (typeof window.sphereRadius !== 'undefined') ? window.sphereRadius : 0.1;
            const initialPipeRadius = (typeof window.pipeRadius !== 'undefined') ? window.pipeRadius : 0.02;
            
            sphereSlider.value = initialSphereRadius;
            pipeSlider.value = initialPipeRadius;
            sphereValueDisplay.textContent = initialSphereRadius.toFixed(3);
            pipeValueDisplay.textContent = initialPipeRadius.toFixed(3);
            
            // Set up universal file input
            setupUniversalFileInput('universalInput', 
                function(treeData, filename) {
                    // Success callback
                    const fileType = filename.substring(filename.lastIndexOf('.'));
                    visualizeTreeData(treeData, `${fileType.toUpperCase()} File (${filename})`);
                },
                function(error, filename) {
                    // Error callback
                    alert(`Error parsing ${filename}: ${error.message}`);
                }
            );

            // Generate sample button
            document.getElementById('generateSample').addEventListener('click', function() {
                const treeData = generateSampleTree();
                visualizeTreeData(treeData, 'Sample Generator');
            });

            // Clear selection button
            document.getElementById('clearSelection').addEventListener('click', function() {
                if (window.selectionManager) {
                    window.selectionManager.clearSelection();
                } else if (typeof clearEdgeSelection === 'function') {
                    clearEdgeSelection();
                }
            });

            // Toggle spacing button
            document.getElementById('toggleSpacing').addEventListener('click', function() {
                if (typeof applySpacing !== 'undefined') {
                    applySpacing = !applySpacing;
                    console.log('🔄 Spacing toggled to:', applySpacing);
                    
                    // Re-visualize with current data if available
                    if (window.currentTreeData) {
                        visualizeTreeData(window.currentTreeData, 'Current (Spacing Toggled)');
                    } else {
                        console.log('⚠️ No current tree data to re-visualize');
                    }
                } else {
                    console.log('❌ Spacing toggle not available');
                }
            });

            // Direct update function for sliders
            function updateRadius(radiusType, newValue) {
                console.log(`🔄 ${radiusType} radius changing to:`, newValue);
                
                // Update global variables immediately
                if (radiusType === 'Sphere') {
                    window.sphereRadius = newValue;
                    sphereRadius = newValue;
                } else if (radiusType === 'Pipe') {
                    window.pipeRadius = newValue;
                    pipeRadius = newValue;
                }
                
                // If tree data exists, reinitialize the graph
                if (window.currentTreeData) {
                    console.log('📊 Reinitializing graph with updated radius...');
                    
                    // Force complete reinitialization first
                    if (typeof forceCompleteReinitialization === 'function') {
                        forceCompleteReinitialization();
                    } else if (typeof window.forceCompleteReinitialization === 'function') {
                        window.forceCompleteReinitialization();
                    }
                    
                    // Call initializeGraph directly to rebuild geometry with new radius
                    if (typeof initializeGraph === 'function') {
                        console.log('🔄 Calling initializeGraph with new radius...');
                        initializeGraph();
                    } else {
                        console.log('⚠️ initializeGraph not available, falling back to visualizeTreeData');
                        visualizeTreeData(window.currentTreeData, `${radiusType} Radius Updated`);
                    }
                } else {
                    console.log('⚠️ No tree data available for re-initialization');
                }
            }

            // Throttled update function for sliders
            let updateTimeout;
            function throttledRadiusUpdate(radiusType, newValue) {
                clearTimeout(updateTimeout);
                updateTimeout = setTimeout(() => {
                    updateRadius(radiusType, newValue);
                }, 150); // 150ms delay to prevent rapid updates
            }

            // Sphere radius slider
            document.getElementById('sphereRadiusSlider').addEventListener('input', function() {
                const newRadius = parseFloat(this.value);
                document.getElementById('sphereRadiusValue').textContent = newRadius.toFixed(3);
                
                // Update global sphere radius variables
                window.sphereRadius = newRadius;
                if (typeof sphereRadius !== 'undefined') {
                    sphereRadius = newRadius;
                }
                
                console.log('🔄 Sphere radius updated:', newRadius, 'Global:', window.sphereRadius);
                throttledRadiusUpdate('Sphere', newRadius);
            });

            // Pipe radius slider
            document.getElementById('pipeRadiusSlider').addEventListener('input', function() {
                const newRadius = parseFloat(this.value);
                document.getElementById('pipeRadiusValue').textContent = newRadius.toFixed(3);
                
                // Update global pipe radius variables
                window.pipeRadius = newRadius;
                if (typeof pipeRadius !== 'undefined') {
                    pipeRadius = newRadius;
                }
                
                console.log('🔄 Pipe radius updated:', newRadius, 'Global:', window.pipeRadius);
                throttledRadiusUpdate('Pipe', newRadius);
            });

            // Add immediate update on slider mouseup for better responsiveness
            document.getElementById('sphereRadiusSlider').addEventListener('mouseup', function() {
                console.log('🔄 Sphere radius mouseup - forcing immediate update');
                const newRadius = parseFloat(this.value);
                clearTimeout(updateTimeout); // Cancel any pending throttled updates
                updateRadius('Sphere', newRadius);
            });

            document.getElementById('pipeRadiusSlider').addEventListener('mouseup', function() {
                console.log('🔄 Pipe radius mouseup - forcing immediate update');
                const newRadius = parseFloat(this.value);
                clearTimeout(updateTimeout); // Cancel any pending throttled updates
                updateRadius('Pipe', newRadius);
            });

            // Initialize global variables needed by the system
            window.offData = ''; // Empty string to prevent undefined errors
            window.currentFileName = 'universal-parser-example';
            
            // Set up canvas resize handler
            window.addEventListener('resize', function() {
                if (typeof handleCanvasResize === 'function') {
                    handleCanvasResize();
                } else {
                    // Fallback implementation
                    const canvas = document.getElementById('canvas');
                    if (canvas && gl) {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                        
                        // Update WebGL viewport
                        gl.viewport(0, 0, canvas.width, canvas.height);
                        
                        // Update projection matrix
                        mat4.perspective(projectionMatrix, Math.PI/3, canvas.width / canvas.height, 0.1, 50);
                        
                        // Re-render the scene
                        if (typeof renderGraph === 'function') {
                            renderGraph();
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
